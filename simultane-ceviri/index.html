<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simultane Çeviri</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #151923;
    --text: #f4f6fb;
    --muted: #8a93a6;
    --accent: #3fb68b;
    --danger: #e5484d;
    --interim: #c9cfdb;
    --font-tr: 44px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 16px; background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; }
  button, select, input {
    font: inherit; font-size: 14px; color: var(--text);
    background: #222838; border: 1px solid #2e3548; border-radius: 8px;
    padding: 7px 12px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04140d; font-weight: 600; }
  button.primary.on { background: var(--danger); border-color: var(--danger); color: #fff; }
  #status { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #555; }
  #dot.live { background: var(--danger); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  #settings { display: none; gap: 10px; flex-wrap: wrap; padding: 10px 16px; background: #10141c; align-items: center; font-size: 13px; color: var(--muted); }
  #settings.open { display: flex; }
  #settings label { display: flex; gap: 6px; align-items: center; }
  #apiKey { width: 280px; }

  main { flex: 1; overflow-y: auto; padding: 24px 16px 40px; scroll-behavior: smooth; }
  .line { max-width: 1200px; margin: 0 auto 22px; }
  .tr { font-size: var(--font-tr); line-height: 1.25; font-weight: 600; }
  .ar { direction: rtl; text-align: right; color: var(--muted); font-size: calc(var(--font-tr) * .45); margin-top: 4px; }
  .line.interim .tr { color: var(--interim); font-weight: 500; }
  body.hide-ar .ar { display: none; }
  #empty { color: var(--muted); text-align: center; margin-top: 18vh; font-size: 18px; line-height: 1.6; padding: 0 16px; }

  #diag { display: none; font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--muted);
    background: #10141c; border-top: 1px solid #2e3548; padding: 8px 16px; max-height: 30vh; overflow-y: auto; white-space: pre-wrap; }
  body.show-diag #diag { display: block; }
  @media (max-width: 600px) {
    :root { --font-tr: 28px; }
    #apiKey { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Arapça → Türkçe</h1>
  <button id="toggle" class="primary">▶ Başlat</button>
  <select id="dialect" title="Arapça lehçe">
    <option value="ar-SA">Arapça (Suudi / Fusha)</option>
    <option value="ar-EG">Arapça (Mısır)</option>
    <option value="ar-AE">Arapça (BAE)</option>
    <option value="ar-IQ">Arapça (Irak)</option>
    <option value="ar-SY">Arapça (Suriye)</option>
    <option value="ar-JO">Arapça (Ürdün)</option>
    <option value="ar-LB">Arapça (Lübnan)</option>
    <option value="ar-MA">Arapça (Fas)</option>
  </select>
  <button id="fullscreen" title="Tam ekran">⛶</button>
  <button id="clear" title="Ekranı temizle">Temizle</button>
  <button id="toggleSettings">Ayarlar</button>
  <span id="status"><span id="dot"></span><span id="statusText">Hazır</span></span>
</header>

<div id="settings">
  <label>Çeviri motoru
    <select id="engine">
      <option value="google">Google Translate (anahtarsız)</option>
      <option value="claude">Claude (API anahtarı gerekir)</option>
    </select>
  </label>
  <label id="keyWrap">Anthropic API anahtarı
    <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
  </label>
  <label>Yazı boyutu <input id="fontSize" type="range" min="20" max="96" value="44"></label>
  <label><input id="showAr" type="checkbox" checked> Arapça metni göster</label>
  <label><input id="liveInterim" type="checkbox" checked> Konuşurken anlık çevir</label>
  <label><input id="showDiag" type="checkbox" checked> Tanı kaydını göster</label>
</div>

<main id="out">
  <div id="empty">
    <b>Başlat</b>'a basın ve mikrofon izni verin.<br>
    Arapça konuşma dinlenir, Türkçesi burada canlı olarak akar.<br>
    <small>Chrome veya Edge kullanın. Bilgisayar sesini (TV, YouTube, Zoom) çevirmek için README'ye bakın.</small>
  </div>
</main>
<div id="diag"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const out = $('out');

// ---------- settings (localStorage is a convenience only) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('sc_' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sc_' + k, JSON.stringify(v)); } catch {} },
};
$('dialect').value = store.get('dialect', 'ar-SA');
$('engine').value = store.get('engine', 'google');
$('apiKey').value = store.get('apiKey', '');
$('fontSize').value = store.get('fontSize', 44);
$('showAr').checked = store.get('showAr', true);
$('liveInterim').checked = store.get('liveInterim', true);
$('showDiag').checked = store.get('showDiag', true);

function applySettings() {
  document.documentElement.style.setProperty('--font-tr', $('fontSize').value + 'px');
  document.body.classList.toggle('hide-ar', !$('showAr').checked);
  document.body.classList.toggle('show-diag', $('showDiag').checked);
  $('keyWrap').style.display = $('engine').value === 'claude' ? 'flex' : 'none';
}
applySettings();
for (const id of ['dialect', 'engine', 'apiKey', 'fontSize', 'showAr', 'liveInterim', 'showDiag']) {
  $(id).addEventListener('input', () => {
    const el = $(id);
    store.set(id, el.type === 'checkbox' ? el.checked : el.value);
    applySettings();
    if (id === 'dialect' && listening) { recognition.lang = el.value; recognition.stop(); }
  });
}
$('toggleSettings').onclick = () => $('settings').classList.toggle('open');
$('fullscreen').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$('clear').onclick = () => { out.innerHTML = ''; interimLine = null; };

// On-screen event log so problems on phones (no dev tools) can be read off the screen.
function log(msg) {
  const d = $('diag');
  const time = new Date().toLocaleTimeString('tr-TR');
  d.textContent = (time + '  ' + msg + '\n' + d.textContent).split('\n').slice(0, 30).join('\n');
}
log('Tarayıcı: ' + navigator.userAgent);

function setStatus(text, live) {
  $('statusText').textContent = text;
  $('dot').classList.toggle('live', !!live);
}

// ---------- translation engines ----------
async function translateGoogle(text, signal) {
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=ar&tl=tr&dt=t&q=' + encodeURIComponent(text);
  const res = await fetch(url, { signal });
  if (!res.ok) throw new Error('Google çeviri hatası ' + res.status);
  const data = await res.json();
  return data[0].map((seg) => seg[0]).join('');
}

let anthropic = null, anthropicKey = null;
async function translateClaude(text, signal, context) {
  const key = $('apiKey').value.trim();
  if (!key) throw new Error('Claude için API anahtarı girin (Ayarlar).');
  if (!anthropic || anthropicKey !== key) {
    const { default: Anthropic } = await import('https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk/+esm');
    anthropic = new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true });
    anthropicKey = key;
  }
  const msg = await anthropic.beta.messages.create({
    model: 'claude-opus-5-5',
    max_tokens: 1024,
    output_config: { effort: 'low' },
    betas: ['server-side-fallback-2026-07-01'],
    fallbacks: 'default',
    system:
      'Sen canlı bir simultane tercümansın. Konuşma tanıma sisteminden gelen Arapça metni akıcı, doğal Türkçeye çevir. ' +
      'Metin konuşma tanımadan geldiği için hatalı veya yarım olabilir; en makul anlamı ver. ' +
      'Yalnızca Türkçe çeviriyi yaz; açıklama, tırnak veya not ekleme.',
    messages: [{
      role: 'user',
      content: (context ? 'Önceki bağlam (çevirme, sadece bağlam için):\n' + context + '\n\n' : '') +
        'Çevrilecek metin:\n' + text,
    }],
  }, { signal });
  if (msg.stop_reason === 'refusal') throw new Error('Claude bu metni çevirmeyi reddetti.');
  return msg.content.filter((b) => b.type === 'text').map((b) => b.text).join('').trim();
}

const recentArabic = [];
function translate(text, signal) {
  return $('engine').value === 'claude'
    ? translateClaude(text, signal, recentArabic.slice(-3).join(' '))
    : translateGoogle(text, signal);
}

// ---------- display ----------
let interimLine = null;
function makeLine(cls) {
  $('empty')?.remove();
  const div = document.createElement('div');
  div.className = 'line ' + (cls || '');
  div.innerHTML = '<div class="tr"></div><div class="ar"></div>';
  out.appendChild(div);
  return div;
}
function scrollDown() {
  const nearBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 300;
  if (nearBottom) out.scrollTop = out.scrollHeight;
}

// ---------- interim (live) translation, debounced ----------
let interimTimer = null, interimAbort = null, lastInterimText = '';
function scheduleInterim(arText) {
  if (!interimLine) interimLine = makeLine('interim');
  interimLine.querySelector('.ar').textContent = arText;
  scrollDown();
  if (!$('liveInterim').checked || arText === lastInterimText) return;
  clearTimeout(interimTimer);
  interimTimer = setTimeout(async () => {
    lastInterimText = arText;
    interimAbort?.abort();
    interimAbort = new AbortController();
    const line = interimLine;
    try {
      const tr = await translate(arText, interimAbort.signal);
      if (line === interimLine) { line.querySelector('.tr').textContent = tr; scrollDown(); }
    } catch (e) { if (e.name !== 'AbortError') log('Anlık çeviri hatası: ' + e.message); }
  }, $('engine').value === 'claude' ? 700 : 300);
}

async function commitFinal(arText) {
  clearTimeout(interimTimer);
  interimAbort?.abort();
  lastInterimText = '';
  const line = interimLine || makeLine();
  interimLine = null;
  line.querySelector('.ar').textContent = arText;
  try {
    const tr = await translate(arText);
    line.querySelector('.tr').textContent = tr;
    line.classList.remove('interim');
    recentArabic.push(arText);
    if (recentArabic.length > 10) recentArabic.shift();
  } catch (e) {
    line.querySelector('.tr').textContent = '⚠ ' + e.message;
    log('Çeviri hatası: ' + e.message);
  }
  scrollDown();
}

// ---------- speech recognition ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// iOS Safari: continuous mode often never delivers final results, so use one
// phrase per session and restart, committing whatever text was heard on end.
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let recognition = null, listening = false;
let committed = new Set(), pendingInterim = '', idleTimer = null, gotAnyResult = false;

function commitPending() {
  clearTimeout(idleTimer);
  if (pendingInterim) { const t = pendingInterim; pendingInterim = ''; commitFinal(t); }
}

if (!SR) {
  setStatus('Bu tarayıcı konuşma tanımayı desteklemiyor — Chrome, Edge veya iPhone\'da Safari kullanın.');
  $('toggle').disabled = true;
} else {
  recognition = new SR();
  recognition.continuous = !isIOS;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onresult = (event) => {
    gotAnyResult = true;
    log('Sonuç: ' + Array.from(event.results).map((r) => (r.isFinal ? '[son] ' : '') + r[0].transcript).join(' | '));
    let interim = '';
    for (let i = 0; i < event.results.length; i++) {
      const r = event.results[i];
      const t = r[0].transcript.trim();
      if (!t || committed.has(i)) continue;
      if (r.isFinal) { committed.add(i); pendingInterim = ''; commitFinal(t); }
      else interim += t + ' ';
    }
    interim = interim.trim();
    if (interim) {
      pendingInterim = interim;
      scheduleInterim(interim);
      setStatus('Konuşma algılandı…', true);
      // If the browser never marks the phrase final, commit it after a pause.
      clearTimeout(idleTimer);
      idleTimer = setTimeout(commitPending, 2000);
    }
  };
  recognition.onstart = () => { committed = new Set(); setStatus('Dinleniyor…', true); log('Dinleme başladı (' + recognition.lang + ')'); };
  recognition.onaudiostart = () => log('Mikrofon açıldı');
  recognition.onsoundstart = () => { setStatus('Ses alınıyor…', true); log('Ses algılandı'); };
  recognition.onspeechstart = () => log('Konuşma algılandı');
  recognition.onnomatch = () => log('Konuşma anlaşılamadı');
  recognition.onerror = (e) => {
    log('Hata: ' + e.error + (e.message ? ' — ' + e.message : ''));
    if ((e.error === 'not-allowed' || e.error === 'service-not-allowed') && !gotAnyResult) {
      setStatus(isIOS
        ? 'İzin yok: Ayarlar → Genel → Klavye → Dikte açık olmalı ve mikrofon izni verilmeli.'
        : 'Mikrofon izni reddedildi.');
      stop();
    } else if (e.error === 'language-not-supported') {
      setStatus('Bu lehçe cihazda desteklenmiyor — Arapça (Suudi) seçin.');
      stop();
    } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
      setStatus('Hata: ' + e.error);
    }
  };
  // Sessions end after a phrase (iOS), silence or ~60s (Chrome); restart while listening.
  recognition.onend = () => {
    log('Dinleme oturumu bitti');
    commitPending();
    if (!listening) { setStatus('Durduruldu'); return; }
    try { recognition.start(); }
    catch (err) { log('Yeniden başlatılamadı: ' + err.message); setStatus('Dinleme durdu — devam etmek için Başlat\'a basın.'); stop(); }
  };
}

function start() {
  recognition.lang = $('dialect').value;
  listening = true;
  gotAnyResult = false;
  try { recognition.start(); } catch (err) { log('Başlatılamadı: ' + err.message); }
  $('toggle').textContent = '■ Durdur';
  $('toggle').classList.add('on');
}
function stop() {
  listening = false;
  recognition.stop();
  $('toggle').textContent = '▶ Başlat';
  $('toggle').classList.remove('on');
}
$('toggle').onclick = () => (listening ? stop() : start());
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); $('toggle').click(); }
});
</script>
</body>
</html>
